<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Vangelo e Valtorta</title>
  <meta name="description" content="Il Vangelo del giorno accanto al brano corrispondente de L'Evangelo come mi è stato rivelato di Maria Valtorta">
  <meta name="theme-color" content="#5b2a1e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Vangelo e Valtorta">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    // tema scelto con il pulsante ☾/☀, applicato prima di disegnare la pagina
    try { const t = JSON.parse(localStorage.getItem('tema')); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">✠</span>
      <span class="brand-name">Vangelo <em>e</em> Valtorta</span>
    </div>
    <nav class="datenav" aria-label="Scelta della data">
      <button class="icon-btn" id="prevDay" title="Giorno precedente" aria-label="Giorno precedente">‹</button>
      <label class="date-field">
        <span class="sr-only">Data</span>
        <input type="date" id="dateInput">
      </label>
      <button class="icon-btn" id="nextDay" title="Giorno successivo" aria-label="Giorno successivo">›</button>
      <button class="text-btn" id="todayBtn">Oggi</button>
    </nav>
    <div class="tools">
      <button class="icon-btn" id="indexBtn" title="Indice dei capitoli" aria-label="Indice dei capitoli">☰</button>
      <button class="icon-btn" id="themeToggle" title="Modalità notte" aria-label="Modalità notte">☾</button>
      <button class="icon-btn" id="fontDown" title="Testo più piccolo" aria-label="Testo più piccolo">A−</button>
      <button class="icon-btn" id="fontUp" title="Testo più grande" aria-label="Testo più grande">A+</button>
      <button class="icon-btn" id="searchToggle" title="Cerca brano o capitolo" aria-label="Cerca">⌕</button>
    </div>
  </header>

  <section class="searchbar" id="searchBar" hidden>
    <form id="searchForm" autocomplete="off">
      <input type="search" id="searchInput" placeholder="Brano (es. Lc 12,39-48), numero di capitolo (es. 415) o parole del titolo">
      <button class="text-btn primary" type="submit">Cerca</button>
    </form>
    <div id="searchResults" class="search-results"></div>
  </section>

  <div class="liturgy" id="liturgy"></div>

  <div class="tabs" role="tablist">
    <button role="tab" class="tab active" data-pane="gospelPane" aria-selected="true">Vangelo</button>
    <button role="tab" class="tab" data-pane="valtortaPane" aria-selected="false">Valtorta</button>
  </div>

  <main class="split">
    <section class="pane" id="gospelPane">
      <div class="pane-head">
        <p class="kicker" id="gospelKicker">Vangelo del giorno</p>
        <h2 id="gospelRef">…</h2>
      </div>
      <div class="actions">
        <button class="text-btn primary" id="shareBoth" title="Invia Vangelo e capitolo della Valtorta a ElevenReader o a un'altra app">Condividi Vangelo + Valtorta</button>
        <button class="text-btn tts-only" id="listenGospel">▶ Ascolta</button>
        <button class="text-btn tts-only" id="listenAll" title="Legge il Vangelo e poi il capitolo della Valtorta">▶ Vangelo + Valtorta</button>
        <button class="text-btn" id="copyGospel">Copia Vangelo</button>
      </div>
      <article class="reading" id="gospelText"></article>
      <p class="source" id="gospelSource"></p>
      <button class="text-btn primary mobile-only" id="toValtorta">Leggi il brano della Valtorta ›</button>
    </section>

    <section class="pane" id="valtortaPane">
      <div class="pane-head">
        <p class="kicker">L'Evangelo come mi è stato rivelato</p>
        <div class="matches" id="matches"></div>
        <h2 id="chapterTitle">…</h2>
        <p class="meta" id="chapterMeta"></p>
      </div>
      <div class="actions sticky">
        <button class="text-btn primary" id="copyChapter">Copia testo</button>
        <button class="text-btn" id="shareChapter" hidden>Condividi</button>
        <button class="text-btn tts-only" id="listenChapter">▶ Ascolta</button>
      </div>
      <div class="options">
        <label class="check"><input type="checkbox" id="withTitle" checked> includi titolo</label>
        <label class="check" title="Toglie le note dell'editore tra parentesi (lettura e copia)"><input type="checkbox" id="noNotes" checked> togli note tra parentesi</label>
        <label class="check tts-only" title="Finito il capitolo, la lettura vocale prosegue con il successivo"><input type="checkbox" id="autoNext"> lettura continua</label>
        <label class="check voice-pick tts-only">voce <select id="ttsVoice"></select></label>
      </div>
      <article class="reading" id="chapterText"></article>
      <nav class="chapter-nav">
        <button class="text-btn" id="prevChapter">‹ Capitolo precedente</button>
        <button class="text-btn primary" id="nextChapter">Continua ›</button>
      </nav>
    </section>
  </main>

  <div class="resume" id="resume" hidden></div>

  <div class="player tts-only" id="player">
    <div class="player-info">
      <span class="player-dot" id="ttsDot"></span>
      <div class="player-text">
        <div class="player-label"><b id="ttsLabel">Lettore vocale</b> <span id="ttsCount"></span></div>
        <div class="player-preview" id="ttsPreview">Tocca una frase per ascoltarla da lì, oppure premi ▶</div>
      </div>
    </div>
    <div class="player-controls">
      <button class="pbtn" id="ttsBack" title="Due frasi indietro" aria-label="Due frasi indietro">⏪</button>
      <button class="pbtn play" id="ttsPlay">▶ Leggi</button>
      <button class="pbtn" id="ttsFwd" title="Due frasi avanti" aria-label="Due frasi avanti">⏩</button>
      <button class="pbtn stop" id="ttsStop" title="Ferma" aria-label="Ferma">■</button>
      <select class="pbtn" id="ttsRate" title="Velocità" aria-label="Velocità">
        <option value="0.8">0.8×</option>
        <option value="0.9">0.9×</option>
        <option value="1" selected>1×</option>
        <option value="1.15">1.15×</option>
        <option value="1.3">1.3×</option>
        <option value="1.5">1.5×</option>
        <option value="1.75">1.75×</option>
        <option value="2">2×</option>
      </select>
    </div>
  </div>
  <div class="sheet" id="indexSheet" role="dialog" aria-modal="true" aria-labelledby="indexTitle" hidden>
    <div class="sheet-head">
      <div class="sheet-row">
        <h2 id="indexTitle">Indice</h2>
        <div class="seg">
          <button type="button" class="seg-btn" data-mode="rapido">Rapido</button>
          <button type="button" class="seg-btn" data-mode="completo">Completo</button>
        </div>
        <button type="button" class="icon-btn" id="indexClose" title="Chiudi" aria-label="Chiudi l'indice">✕</button>
      </div>
      <nav class="vol-jump" id="volJump" aria-label="Vai al volume"></nav>
      <form class="idx-search" id="indexSearch" autocomplete="off" hidden>
        <input type="search" id="indexFilter" enterkeyhint="search" autocapitalize="off" spellcheck="false">
        <div class="seg small">
          <button type="button" class="scope-btn" data-scope="titoli">Titoli</button>
          <button type="button" class="scope-btn" data-scope="testo">Tutto il testo</button>
        </div>
      </form>
    </div>
    <div class="sheet-body" id="indexBody"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
